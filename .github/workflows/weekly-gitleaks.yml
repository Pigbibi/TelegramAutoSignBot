# Keep the shared ref pinned to a reviewed full commit SHA.
name: Weekly all-branch secret scan

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    uses: Pigbibi/PrGovernance/.github/workflows/gitleaks.yml@3d44e3d057681d5ae2730ad76af2f53b72d26767
    secrets: inherit
    with:
      full-history: true
