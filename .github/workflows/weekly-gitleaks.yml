# Keep the shared ref pinned to a reviewed full commit SHA.
name: Weekly all-branch secret scan

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    uses: Pigbibi/PrGovernance/.github/workflows/gitleaks.yml@18ad203d889f7ebea267afacaf48c9c204718b42
    secrets: inherit
    with:
      full-history: true
