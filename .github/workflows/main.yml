name: Telegram Auto Sign

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-auto-sign
  cancel-in-progress: false

jobs:
  run-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Run check-in script
        id: checkin
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_CONFIG: ${{ vars.BOT_CONFIG }}
        run: python main.py

      - name: Prepare log for logs branch
        id: log_prepare
        if: ${{ !cancelled() && steps.checkin.outcome != 'skipped' }}
        run: |
          test -f checkin.log || exit 0
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          mv checkin.log temp_new_log.txt
          
          git fetch origin logs || true
          
          if git show-ref --verify --quiet refs/remotes/origin/logs; then
            git checkout logs
            git pull origin logs --rebase
          else
            git checkout --orphan logs
            git rm -rf .
          fi
          
          cat temp_new_log.txt >> checkin.log
          
          rm temp_new_log.txt
          
          git add checkin.log
          git commit -m "Auto check-in log update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Scan log publication
        id: log_scan
        if: ${{ !cancelled() && steps.checkin.outcome != 'skipped' && steps.log_prepare.outputs.ready == 'true' }}
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273
        with:
          path: checkin.log

      - name: Publish log to logs branch
        if: ${{ !cancelled() && steps.checkin.outcome != 'skipped' && steps.log_prepare.outputs.ready == 'true' && steps.log_scan.outcome == 'success' }}
        run: git push origin logs
