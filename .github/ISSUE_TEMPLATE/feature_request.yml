name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Account-security and service-policy impact
  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and removed private data.
          required: true
